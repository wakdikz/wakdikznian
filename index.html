<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAKDIKZ - ACCESS LOCKED</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: white;
  font-family: monospace;
  min-height: 100vh;
  overflow: hidden;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#matrix { z-index: 0; }
#particles { z-index: 1; }
#noise { z-index: 5; opacity: .12; }

.screen {
  position: relative;
  z-index: 3;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  background: radial-gradient(
    ellipse at center,
    #16000088,
    transparent 65%
  );
}

.content {
  width: 100%;
  max-width: 700px;
}

.tag {
  color: #ff3030;
  letter-spacing: 7px;
  font-size: 11px;
  margin-bottom: 25px;
  text-shadow: 0 0 12px red;
}

.title {
  position: relative;
  font-size: clamp(45px, 12vw, 95px);
  font-weight: 900;
  letter-spacing: 5px;
  color: #eee;
  text-shadow:
    3px 0 red,
    -3px 0 blue,
    0 0 25px #ff0000;
  animation: titleGlitch .18s infinite steps(2);
}

.title::before,
.title::after {
  content: "WAKDIKZ";
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.title::before {
  color: #ff2020;
  transform: translateX(-3px);
  clip-path: inset(15% 0 65% 0);
}

.title::after {
  color: #00aaff;
  transform: translateX(3px);
  clip-path: inset(65% 0 10% 0);
}

@keyframes titleGlitch {
  0% { transform: translate(0); }
  25% { transform: translate(2px, -1px); }
  50% { transform: translate(-2px, 1px); }
  75% { transform: translate(1px, 2px); }
  100% { transform: translate(0); }
}

.locked {
  margin-top: 28px;
  display: inline-block;
  border: 1px solid #ff2525;
  padding: 12px 30px;
  color: #ff3030;
  letter-spacing: 6px;
  font-size: 15px;
  box-shadow: 0 0 20px #ff000055;
  animation: borderGlitch .5s infinite alternate;
}

@keyframes borderGlitch {
  from { box-shadow: 0 0 8px #ff000044; }
  to { box-shadow: 0 0 24px #ff0000aa; }
}

.description {
  color: #777;
  font-size: 11px;
  letter-spacing: 3px;
  margin-top: 25px;
}

.status {
  margin-top: 45px;
  color: #ff3030;
  font-size: 10px;
  letter-spacing: 4px;
}

.marquee {
  position: fixed;
  bottom: 20px;
  left: 0;
  width: 100%;
  overflow: hidden;
  color: #a22;
  font-size: 10px;
  letter-spacing: 4px;
  white-space: nowrap;
  z-index: 4;
}

.marquee span {
  display: inline-block;
  animation: moveText 12s linear infinite;
}

@keyframes moveText {
  from { transform: translateX(100vw); }
  to { transform: translateX(-100%); }
}

/* 5 KILATAN SAJA, LALU BERHENTI */
#flash {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: white;
  opacity: 0;
  pointer-events: none;
  animation: fiveFlashes 0.01s linear forwards;
}

@keyframes fiveFlashes {
  0%, 6% { opacity: 1; }
  10%, 16% { opacity: 0; }

  20%, 26% { opacity: 1; }
  30%, 36% { opacity: 0; }

  40%, 46% { opacity: 1; }
  50%, 56% { opacity: 0; }

  60%, 66% { opacity: 1; }
  70%, 76% { opacity: 0; }

  80%, 86% { opacity: 1; }
  90%, 100% { opacity: 0; }
}

/* SCANLINES */
.scanlines {
  position: fixed;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    #ffffff0b 4px
  );
}

/* RGB GLITCH */
.colorGlitch {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: linear-gradient(
    90deg,
    #ff000010,
    transparent 35%,
    #0066ff12
  );
  animation: colorShift 2s infinite alternate;
}

@keyframes colorShift {
  0% { opacity: .2; }
  100% { opacity: .8; }
}

@media (prefers-reduced-motion: reduce) {
  #flash {
    animation: none;
    opacity: 0;
  }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>
<canvas id="particles"></canvas>
<canvas id="noise"></canvas>

<div class="colorGlitch"></div>
<div class="scanlines"></div>
<div id="flash"></div>

<main class="screen">
  <div class="content">
    <div class="tag">WAKDIKZ SYSTEM // SECURITY PROTOCOL</div>

    <h1 class="title">WAKDIKZ</h1>

    <div class="locked">AKSES LOCKED</div>

    <p class="description">
      UNAUTHORIZED ACCESS DETECTED
    </p>

    <div class="status">
      SYSTEM STATUS : RESTRICTED
    </div>
  </div>
</main>

<div class="marquee">
  <span>
    WARNING // ACCESS DENIED // WAKDIKZ SYSTEM //
    CONNECTION RESTRICTED // ACCESS DENIED //
  </span>
</div>

<script>
/* MATRIX RAIN */
const matrix = document.getElementById("matrix");
const ctx = matrix.getContext("2d");

let width, height, columns, drops;
const chars = "01アイウエオカキクケコサシスセソ";

function resizeMatrix() {
  width = matrix.width = innerWidth;
  height = matrix.height = innerHeight;
  columns = Math.floor(width / 16);
  drops = Array(columns).fill(1);
}

function drawMatrix() {
  ctx.fillStyle = "rgba(0,0,0,0.09)";
  ctx.fillRect(0, 0, width, height);
  ctx.font = "14px monospace";

  for (let i = 0; i < drops.length; i++) {
    const char = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillStyle = Math.random() > .96 ? "#ff3030" : "#00ff66";
    ctx.fillText(char, i * 16, drops[i] * 16);

    if (drops[i] * 16 > height && Math.random() > .975) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}

/* PARTICLES */
const particles = document.getElementById("particles");
const pctx = particles.getContext("2d");
let dots = [];

function resizeParticles() {
  particles.width = innerWidth;
  particles.height = innerHeight;

  dots = Array.from({length: 65}, () => ({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    speed: .3 + Math.random() * 1.2,
    size: Math.random() * 2 + .5
  }));
}

function drawParticles() {
  pctx.clearRect(0, 0, particles.width, particles.height);

  dots.forEach(p => {
    p.y += p.speed;

    if (p.y > innerHeight) {
      p.y = 0;
      p.x = Math.random() * innerWidth;
    }

    pctx.fillStyle = "#ff333388";
    pctx.fillRect(p.x, p.y, p.size, p.size);
  });
}

/* TV NOISE */
const noise = document.getElementById("noise");
const nctx = noise.getContext("2d");

function resizeNoise() {
  noise.width = Math.ceil(innerWidth / 4);
  noise.height = Math.ceil(innerHeight / 4);
}

function drawNoise() {
  const img = nctx.createImageData(noise.width, noise.height);

  for (let i = 0; i < img.data.length; i += 4) {
    const value = Math.random() * 255;
    img.data[i] = value;
    img.data[i + 1] = value;
    img.data[i + 2] = value;
    img.data[i + 3] = Math.random() * 90;
  }

  nctx.putImageData(img, 0, 0);
}

/* START */
resizeMatrix();
resizeParticles();
resizeNoise();

window.addEventListener("resize", () => {
  resizeMatrix();
  resizeParticles();
  resizeNoise();
});

setInterval(drawMatrix, 55);
setInterval(drawParticles, 30);
setInterval(drawNoise, 100);
</script>

</body>
</html>
